<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="336" viewBox="0 0 1000 336" role="img" aria-label="Terraform: The Plan That Would Have Leaked Everything">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#4c1d95"/></linearGradient><radialGradient id="glow" cx=".85" cy=".5" r=".6"><stop offset="0" stop-color="#34d399" stop-opacity=".28"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient></defs>
<rect width="1000" height="336" rx="18" fill="url(#bg)"/><rect width="1000" height="336" rx="18" fill="url(#glow)"/>
<circle cx="60" cy="40" r="3" fill="#34d399" opacity=".7"><animate attributeName="opacity" values=".2;.9;.2" dur="3s" repeatCount="indefinite"/></circle>
<text x="48" y="64" font-size="14" letter-spacing="3" fill="#34d399" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="700">DEVOPS BOOTCAMP · LAB</text>
<text x="48" y="112" font-size="32" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Terraform: The Plan That Would</text>
<text x="48" y="150" font-size="32" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Have Leaked Everything</text>
<text x="48" y="180" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">A colleague&#x27;s pull request creates a bucket, a server, a database and</text>
<text x="48" y="202" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">an IAM policy for Pollie. It plans cleanly and it would have put</text>
<text x="48" y="224" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">customer data on the internet, opened the database to the world and</text>
<text x="48" y="246" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">given the app the keys to the whole account. Nothing is deployed: find…</text>
<rect x="48" y="278" width="114" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#34d399" stroke-opacity=".7"/><text x="62" y="299" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">90-105 min</text>
<rect x="174" y="278" width="354" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#34d399" stroke-opacity=".7"/><text x="188" y="299" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Cost: free (nothing is created in AWS)</text>
<g transform="translate(750,68)">
<path d="M110 14 L190 44 V104 C190 148 150 176 110 190 C70 176 30 148 30 104 V44 Z" fill="none" stroke="#34d399" stroke-width="8" stroke-linejoin="round"/>
<path d="M72 104 L100 132 L150 76" fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="140" stroke-dashoffset="140"><animate attributeName="stroke-dashoffset" values="140;0;0;140" keyTimes="0;.35;.85;1" dur="4s" repeatCount="indefinite"/></path>
<path d="M110 14 L190 44 V104 C190 148 150 176 110 190 C70 176 30 148 30 104 V44 Z" fill="#34d399" opacity="0"><animate attributeName="opacity" values="0;.18;0" dur="4s" repeatCount="indefinite"/></path>
</g>
</svg>